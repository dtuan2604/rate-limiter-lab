[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-limiter-traffic-simulator"
version = "0.0.0"
description = "Phase 0 package foundation; traffic generation begins in Phase 5."
readme = "README.md"
requires-python = ">=3.12,<3.13"

[project.scripts]
rate-limiter-traffic-simulator = "rate_limiter_traffic_simulator.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rate_limiter_traffic_simulator"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "D", "E4", "E7", "E9", "F", "I", "RUF", "S", "SIM", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rate_limiter_traffic_simulator"]
