spring:
  application:
    name: rate-limiter-gateway

rate-limiter:
  gateway:
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8101}
    backend-timeout: 2s
    policies:
      - id: catalog-client-fixed-window
        version: 1
        route-id: catalog.items
        path: /proxy/catalog/items
        method: GET
        algorithm: FIXED_WINDOW
        limit: 5
        window: 10s

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,catalogBackend
