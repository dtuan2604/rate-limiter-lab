spring:
  application:
    name: rate-limiter-gateway
  data:
    redis:
      connect-timeout: 500ms
      timeout: ${REDIS_COMMAND_TIMEOUT:750ms}
  r2dbc:
    url: ${POSTGRES_R2DBC_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    url: ${POSTGRES_JDBC_URL}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    locations: classpath:db/migration

logging:
  structured:
    format:
      console: logstash

rate-limiter:
  gateway:
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8101}
    backend-timeout: 2s
    state-backend: ${RATE_LIMIT_STATE_BACKEND:REDIS}
    failure-mode: ${RATE_LIMIT_FAILURE_MODE:FAIL_CLOSED}
    instance-id: ${GATEWAY_INSTANCE_ID:local-gateway}
    expose-instance-header: ${EXPOSE_GATEWAY_INSTANCE_HEADER:false}
    redis-command-timeout: 750ms
  policy-control:
    enabled: ${POLICY_CONTROL_ENABLED:true}
    admin-bearer-token: ${ADMIN_BEARER_TOKEN}
    admin-actor: ${ADMIN_PRINCIPAL:local-admin}
    event-channel: rate-limiter:policy-events:v1
    database-timeout: 5s
    outbox-poll-interval: ${POLICY_OUTBOX_POLL_INTERVAL:250ms}
    outbox-lease-duration: 10s
    reconciliation-interval: ${POLICY_RECONCILIATION_INTERVAL:30s}
    maximum-event-bytes: 4096
    acceptance-controls-enabled: ${POLICY_ACCEPTANCE_CONTROLS_ENABLED:false}

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,catalogBackend,rateLimitState
