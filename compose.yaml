name: rate-limiter-lab

services:
  catalog:
    build:
      context: .
      dockerfile: mock-services/Dockerfile
    environment:
      CATALOG_DELAY_MILLISECONDS: "0"
      CATALOG_TEST_ENDPOINTS_ENABLED: "true"
    ports:
      - "8101:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      CATALOG_BASE_URL: http://catalog:8000
    depends_on:
      catalog:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:8080/actuator/health/readiness"
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
