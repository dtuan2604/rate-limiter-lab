name: rate-limiter-lab

x-gateway: &gateway
  build:
    context: .
    dockerfile: gateway/Dockerfile
  environment:
    ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN:?ADMIN_BEARER_TOKEN is required}
    CATALOG_BASE_URL: http://mock-catalog-service:8000
    EXPOSE_GATEWAY_INSTANCE_HEADER: "true"
    RATE_LIMIT_FAILURE_MODE: ${RATE_LIMIT_FAILURE_MODE:-FAIL_CLOSED}
    RATE_LIMIT_STATE_BACKEND: REDIS
    REDIS_COMMAND_TIMEOUT: 750ms
    POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rate_limiter}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-rate_limiter}
    POSTGRES_USER: ${POSTGRES_USER:-rate_limiter}
    SPRING_DATA_REDIS_CONNECT_TIMEOUT: 500ms
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: "6379"
  depends_on:
    mock-catalog-service:
      condition: service_started
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "wget",
        "--quiet",
        "--spider",
        "http://localhost:8080/actuator/health/readiness"
      ]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 10s

services:
  mock-catalog-service:
    build:
      context: .
      dockerfile: mock-services/Dockerfile
    environment:
      CATALOG_DELAY_MILLISECONDS: "0"
      CATALOG_TEST_ENDPOINTS_ENABLED: "true"
    ports:
      - "8101:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"
        ]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7.4.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rate_limiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-rate_limiter}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rate_limiter} -d ${POSTGRES_DB:-rate_limiter}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  gateway-1:
    <<: *gateway
    environment:
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN:?ADMIN_BEARER_TOKEN is required}
      CATALOG_BASE_URL: http://mock-catalog-service:8000
      EXPOSE_GATEWAY_INSTANCE_HEADER: "true"
      GATEWAY_INSTANCE_ID: gateway-1
      POLICY_ACCEPTANCE_CONTROLS_ENABLED: ${POLICY_ACCEPTANCE_CONTROLS_ENABLED:-false}
      POLICY_RECONCILIATION_INTERVAL: ${POLICY_RECONCILIATION_INTERVAL:-30s}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rate_limiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-rate_limiter}
      POSTGRES_USER: ${POSTGRES_USER:-rate_limiter}
      RATE_LIMIT_FAILURE_MODE: ${RATE_LIMIT_FAILURE_MODE:-FAIL_CLOSED}
      RATE_LIMIT_STATE_BACKEND: REDIS
      REDIS_COMMAND_TIMEOUT: 750ms
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 500ms
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8081:8080"

  gateway-2:
    <<: *gateway
    environment:
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN:?ADMIN_BEARER_TOKEN is required}
      CATALOG_BASE_URL: http://mock-catalog-service:8000
      EXPOSE_GATEWAY_INSTANCE_HEADER: "true"
      GATEWAY_INSTANCE_ID: gateway-2
      POLICY_ACCEPTANCE_CONTROLS_ENABLED: ${POLICY_ACCEPTANCE_CONTROLS_ENABLED:-false}
      POLICY_RECONCILIATION_INTERVAL: ${POLICY_RECONCILIATION_INTERVAL:-30s}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rate_limiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-rate_limiter}
      POSTGRES_USER: ${POSTGRES_USER:-rate_limiter}
      RATE_LIMIT_FAILURE_MODE: ${RATE_LIMIT_FAILURE_MODE:-FAIL_CLOSED}
      RATE_LIMIT_STATE_BACKEND: REDIS
      REDIS_COMMAND_TIMEOUT: 750ms
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 500ms
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8082:8080"

  gateway-3:
    <<: *gateway
    environment:
      ADMIN_BEARER_TOKEN: ${ADMIN_BEARER_TOKEN:?ADMIN_BEARER_TOKEN is required}
      CATALOG_BASE_URL: http://mock-catalog-service:8000
      EXPOSE_GATEWAY_INSTANCE_HEADER: "true"
      GATEWAY_INSTANCE_ID: gateway-3
      POLICY_ACCEPTANCE_CONTROLS_ENABLED: ${POLICY_ACCEPTANCE_CONTROLS_ENABLED:-false}
      POLICY_RECONCILIATION_INTERVAL: ${POLICY_RECONCILIATION_INTERVAL:-30s}
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rate_limiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-rate_limiter}
      POSTGRES_USER: ${POSTGRES_USER:-rate_limiter}
      RATE_LIMIT_FAILURE_MODE: ${RATE_LIMIT_FAILURE_MODE:-FAIL_CLOSED}
      RATE_LIMIT_STATE_BACKEND: REDIS
      REDIS_COMMAND_TIMEOUT: 750ms
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 500ms
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8083:8080"

  load-balancer:
    image: haproxy:3.0.8-alpine
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      gateway-1:
        condition: service_started
      gateway-2:
        condition: service_started
      gateway-3:
        condition: service_started
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://127.0.0.1:8080/actuator/health/readiness"
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
