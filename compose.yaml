name: rate-limiter-lab

services:
  load-balancer:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    expose:
      - "8080"
    deploy:
      replicas: 3
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:8080/actuator/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  admin-portal:
    build:
      context: .
      dockerfile: admin-portal/Dockerfile
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  catalog:
    build:
      context: .
      dockerfile: mock-services/Dockerfile
    ports:
      - "8101:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  orders:
    build:
      context: .
      dockerfile: mock-services/Dockerfile
    command:
      [
        "rate_limiter_mock_services.orders:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    ports:
      - "8102:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  payments:
    build:
      context: .
      dockerfile: mock-services/Dockerfile
    command:
      [
        "rate_limiter_mock_services.payments:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    ports:
      - "8103:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  traffic-simulator:
    build:
      context: .
      dockerfile: traffic-simulator/Dockerfile
    profiles:
      - tools

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:9090/-/healthy"
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:3000/api/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  postgres-data:
