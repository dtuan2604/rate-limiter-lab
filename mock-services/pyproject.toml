[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-limiter-mock-services"
version = "0.0.0"
description = "Phase 2 catalog backend plus health-only future-service foundations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn==0.51.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "D", "E4", "E7", "E9", "F", "I", "RUF", "S", "SIM", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rate_limiter_mock_services"]
