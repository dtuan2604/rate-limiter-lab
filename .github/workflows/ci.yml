name: Phase 0 CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase-0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: admin-portal/package-lock.json

      - name: Set up Python Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: rate-limiter
          auto-activate-base: false
          python-version: "3.12.13"

      - name: Install pinned dependencies
        run: |
          conda run -n rate-limiter python -m pip install --disable-pip-version-check --requirement requirements-dev.lock
          conda run -n rate-limiter python -m pip install --disable-pip-version-check --no-deps --editable traffic-simulator --editable mock-services
          npm install --global npm@11.6.0
          npm --prefix admin-portal ci --no-audit --no-fund

      - name: Run CI-equivalent verification
        run: scripts/verify.sh
